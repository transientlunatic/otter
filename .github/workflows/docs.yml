name: Documentation

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # setuptools_scm and sphinx-multiversion need full history and tags

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install dependencies
      run: python -m pip install -e ".[docs]"

    - name: Build documentation (single version, fails on build errors)
      if: github.event_name == 'pull_request'
      run: make -C docs html

    - name: Build documentation (all versions)
      if: github.event_name == 'push'
      run: make -C docs multi

    - name: Add a root page redirecting to the newest release (or main)
      if: github.event_name == 'push'
      run: |
        cd docs/_build/html
        latest=$(ls -d v*/ 2>/dev/null | tr -d '/' | sort -V | tail -n 1)
        latest=${latest:-main}
        printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=%s/index.html"><link rel="canonical" href="%s/index.html"><a href="%s/index.html">Otter documentation</a>\n' "$latest" "$latest" "$latest" > index.html

    - name: Upload documentation artifact
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: docs/_build/html/

    - name: Deploy documentation
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: horochx/deploy-via-scp@v1.0.1
      with:
        local: docs/_build/html/
        remote: /home/danwilliams/code.daniel-williams.co.uk/otter
        host: ${{ secrets.sshhost }}
        user: ${{ secrets.sshuser }}
        key: ${{ secrets.sshkey }}
